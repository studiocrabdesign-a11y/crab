<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRAB Design Studio — Architecture &amp; Interior Design</title>
<meta name="description" content="CRAB Design Studio is an architecture and interior design practice based in Bengaluru and working worldwide, crafting spaces that inspire and endure. Launching soon — join the list.">
<meta name="theme-color" content="#040404">
<link rel="canonical" href="https://crabdesignstudio.com/">

<meta property="og:title" content="CRAB Design Studio — Architecture &amp; Interior Design">
<meta property="og:description" content="An architecture and interior design practice crafting spaces that inspire and endure.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://crabdesignstudio.com/">
<meta property="og:site_name" content="CRAB Design Studio">
<meta property="og:image" content="https://crabdesignstudio.com/assets/hero.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="CRAB Design Studio — Architecture &amp; Interior Design">
<meta name="twitter:description" content="An architecture and interior design practice crafting spaces that inspire and endure.">
<meta name="twitter:image" content="https://crabdesignstudio.com/assets/hero.jpg">

<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">

<!-- Structured data for search engines -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "additionalType": "https://schema.org/Architect",
  "name": "CRAB Design Studio",
  "url": "https://crabdesignstudio.com",
  "logo": "https://crabdesignstudio.com/assets/logo.png",
  "image": "https://crabdesignstudio.com/assets/hero.jpg",
  "description": "Architecture, interiors and design studio in Bengaluru crafting spaces that inspire and endure.",
  "slogan": "We craft spaces that inspire and endure.",
  "knowsAbout": ["Architecture", "Interior Design", "Design"],
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Bengaluru",
    "addressRegion": "Karnataka",
    "addressCountry": "IN"
  },
  "areaServed": "Worldwide",
  "sameAs": [
    "https://www.instagram.com/crabdesign_studio/",
    "https://www.linkedin.com/crab_design_studio"
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "CRAB Design Studio",
  "url": "https://crabdesignstudio.com"
}
</script>
</head>
<body>

<!-- grain overlay -->
<div class="grain" aria-hidden="true"></div>
<!-- vignette -->
<div class="vignette" aria-hidden="true"></div>
<!-- light-sweep confirmation overlay -->
<div class="lightwipe" id="lightwipe" aria-hidden="true"><span class="lightwipe__line"></span></div>

<div class="shell">

  <!-- ─────────── HEADER ─────────── -->
  <header class="header">
    <a href="#" class="logo" aria-label="CRAB Design Studio">
      <!-- the supplied logo artwork, used as-is -->
      <img class="logo-mark" src="assets/logo.png" width="674" height="240"
           alt="CRAB Design Studio">
    </a>

    <nav class="nav" aria-label="Primary">
      <a href="#">Architecture</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="#">Interiors</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="#">Design</a>
      <span class="sep" aria-hidden="true"></span>
      <a href="blog/">Journal</a>
    </nav>
  </header>

  <!-- ─────────── MAIN ─────────── -->
  <main class="main">

    <section class="content">
      <h1 class="title">
        <span class="line" data-text="COMING"></span>
        <span class="line" data-text="SOON"></span>
      </h1>

      <div class="rule" aria-hidden="true"></div>

      <p class="tagline">
        We're crafting spaces<br>
        that inspire and endure.
      </p>

      <!-- ─────────── CONTACT: notify (primary) + message (opt-in) ─────────── -->
      <div class="contact">

        <!-- primary: launch waitlist -->
        <div class="notify" id="notify">
          <label class="notify-label" for="email">Get notified when we launch</label>
          <form class="form" id="form" novalidate>
            <input
              type="email"
              id="email"
              name="email"
              class="input"
              placeholder="Enter your email"
              autocomplete="email"
              required
              aria-describedby="form-msg">
            <button type="submit" class="submit" aria-label="Submit email">
              <svg viewBox="0 0 32 12" aria-hidden="true">
                <path d="M0 6 H29 M24 1 L30 6 L24 11" fill="none"
                      stroke="currentColor" stroke-width="1.1"
                      stroke-linecap="square" stroke-linejoin="miter"/>
              </svg>
            </button>
          </form>
          <p class="form-msg" id="form-msg" role="status" aria-live="polite"></p>

          <button class="contact-switch" id="to-message" type="button">
            Have a project in mind? <span>Send us a message&nbsp;&rarr;</span>
          </button>
        </div>

        <!-- opt-in: guided message dialogue -->
        <div class="convo" id="convo" hidden>
          <button class="convo__leave" id="to-notify" type="button">&larr;&nbsp;Notify me instead</button>
          <p class="convo__eyebrow">Start a conversation</p>

          <div class="convo__stage" id="convo-stage">
            <span class="convo__count" aria-hidden="true"><b id="convo-n">01</b> / 03</span>

            <p class="convo__q" id="convo-q" aria-live="polite"></p>

            <div class="convo__field">
              <input class="convo__input" id="convo-input" type="text"
                     autocomplete="off" autocapitalize="sentences"
                     aria-labelledby="convo-q" aria-describedby="convo-err">
              <textarea class="convo__input convo__input--area" id="convo-area" rows="2"
                        aria-labelledby="convo-q" aria-describedby="convo-err" hidden></textarea>
              <button class="convo__next" id="convo-next" type="button" aria-label="Continue">
                <svg viewBox="0 0 32 12" aria-hidden="true">
                  <path d="M0 6 H29 M24 1 L30 6 L24 11" fill="none"
                        stroke="currentColor" stroke-width="1.1"
                        stroke-linecap="square" stroke-linejoin="miter"/>
                </svg>
              </button>
            </div>

            <div class="convo__meta">
              <button class="convo__back" id="convo-back" type="button" hidden>&larr; Back</button>
              <span class="convo__hint" id="convo-hint"></span>
            </div>
            <p class="convo__err" id="convo-err" role="alert"></p>
          </div>

          <div class="convo__done" id="convo-done" hidden>
            <p class="convo__done-title">Received.</p>
            <p class="convo__done-sub">Thank you<span id="convo-name"></span>. We&rsquo;ll be in touch.</p>
          </div>
        </div>

      </div>
    </section>

    <!-- ─────────── ARCHITECTURAL PHOTOGRAPH ─────────── -->
    <section class="scene" aria-hidden="true">
      <div class="scene-inner" id="scene">
        <img class="scene-img" src="assets/hero.jpg" width="736" height="644"
             alt="" decoding="async">
      </div>
    </section>

  </main>

  <!-- ─────────── FOOTER ─────────── -->
  <footer class="footer">
    <ul class="social">
      <li><a href="https://www.instagram.com/crabdesign_studio/" target="_blank" rel="noopener">Instagram</a></li>
      <li><a href="https://www.linkedin.com/crab_design_studio" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="#">Behance</a></li>
    </ul>
    <p class="copyright"><span class="locale" id="locale"></span>&copy; 2026 CRAB Design Studio</p>
  </footer>

</div>

<!-- EmailJS SDK — public key is safe to expose (read the note in script.js) -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="script.js?v=4"></script>
</body>
</html>
