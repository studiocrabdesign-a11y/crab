# ============================================================
#  CRAB Journal — CMS configuration
#  Editor lives at:  https://crabdesignstudio.com/admin/
# ============================================================

# To test locally: open this /admin/ page on localhost in Chrome or Edge and
# click "Work with Local Repository" — it reads/writes your files directly,
# no GitHub needed. In production the github backend below is used.
backend:
  name: github
  repo: studiocrabdesign-a11y/crab
  branch: main
  # OAuth login relay (Cloudflare Worker). Holds the OAuth secret so it
  # never lives in this public repo. "Sign in with GitHub" routes through it.
  base_url: https://sveltia-cms-auth.studiocrabdesign.workers.dev

# where uploaded images are stored / referenced from
media_folder: assets/blog
public_folder: assets/blog

# a clean, human-readable commit message per publish
site_url: https://crabdesignstudio.com

collections:
  - name: posts
    label: Journal Posts
    label_singular: Post
    description: Write and publish articles for the Journal.
    folder: content/posts
    create: true
    delete: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    summary: '{{title}}  —  {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title,    label: Title,       widget: string }
      - { name: category, label: Category,    widget: select, options: [Architecture, Interiors, Design], default: Architecture }
      - { name: date,     label: Date,        widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { name: image,    label: Cover image, widget: image, choose_url: false }
      - { name: excerpt,  label: Excerpt, hint: 'One or two sentences shown on the card.', widget: text }
      - { name: body,     label: Body, hint: 'One idea per paragraph. Leave a blank line between paragraphs.', widget: text }
